<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <rect width="900" height="400" fill="#fbfcff"/>
  <text x="450" y="52" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="27" font-weight="600" fill="#1d2433">以太主题 · 背景玻璃引擎</text>
  <text x="450" y="79" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#8a93a6">零布局侵入 · 逐字节回滚 · WCAG 对比度兜底</text>

  <!-- 左面板：输入/状态 -->
  <rect x="48" y="112" width="300" height="196" rx="18" fill="none" stroke="#5b7cfa" stroke-width="2.4"/>
  <text x="72" y="146" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#5b7cfa">输入 / 状态</text>
  <rect x="72" y="162" width="120" height="30" rx="8" fill="none" stroke="#5b7cfa" stroke-width="2"/>
  <text x="132" y="182" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3c4a66">宿主 DSH</text>
  <rect x="206" y="162" width="118" height="30" rx="8" fill="none" stroke="#5b7cfa" stroke-width="2"/>
  <text x="265" y="182" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3c4a66">壁纸 / 视频</text>
  <rect x="72" y="206" width="252" height="30" rx="8" fill="none" stroke="#7a5cff" stroke-width="2"/>
  <text x="198" y="226" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3c4a66">采样均色 + 主色衍生</text>
  <rect x="72" y="250" width="120" height="30" rx="8" fill="none" stroke="#7a5cff" stroke-width="2"/>
  <text x="132" y="270" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3c4a66">6 区域透明度</text>
  <rect x="206" y="250" width="118" height="30" rx="8" fill="none" stroke="#9a5b1e" stroke-width="2"/>
  <text x="265" y="270" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#9a5b1e">对比度不足</text>

  <!-- 箭头 -->
  <path d="M356 196 H 438" stroke="#5b7cfa" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M430 190 L 440 196 L 430 202" stroke="#5b7cfa" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M356 262 H 438" stroke="#7a5cff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-dasharray="6 6"/>
  <path d="M430 256 L 440 262 L 430 268" stroke="#7a5cff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 右面板：输出/结果 -->
  <rect x="452" y="112" width="400" height="196" rx="18" fill="none" stroke="#2f7d4f" stroke-width="2.4"/>
  <text x="476" y="146" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#2f7d4f">输出 / 结果</text>
  <rect x="476" y="162" width="160" height="30" rx="8" fill="none" stroke="#2f7d4f" stroke-width="2"/>
  <text x="556" y="182" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3c4a66">隔离背景层</text>
  <rect x="652" y="162" width="176" height="30" rx="8" fill="none" stroke="#2f7d4f" stroke-width="2"/>
  <text x="740" y="182" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3c4a66">CSS 变量注入</text>
  <rect x="476" y="206" width="160" height="30" rx="8" fill="none" stroke="#5b7cfa" stroke-width="2"/>
  <text x="556" y="226" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3c4a66">文字 ≥ 7:1</text>
  <rect x="652" y="206" width="176" height="30" rx="8" fill="none" stroke="#7a5cff" stroke-width="2"/>
  <text x="740" y="226" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3c4a66">玻璃 / 9-slice</text>
  <rect x="476" y="250" width="352" height="30" rx="8" fill="none" stroke="#9a5b1e" stroke-width="2"/>
  <text x="652" y="270" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#9a5b1e">一键恢复默认（逐字节备份在磁盘）</text>

  <!-- 底部模块条 -->
  <line x1="48" y1="334" x2="852" y2="334" stroke="#dfe4ee" stroke-width="1.6"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#6b7488">
    <text x="48" y="358">主题引擎</text>
    <text x="128" y="358">壁纸轮换</text>
    <text x="212" y="358">时段 / 分类锁定</text>
    <text x="348" y="358">玻璃解耦</text>
    <text x="428" y="358">像素 9-slice</text>
    <text x="532" y="358">主题包导入导出</text>
    <text x="670" y="358">服务注入</text>
    <text x="742" y="358">诊断面板</text>
    <text x="818" y="358">模块化</text>
  </g>
  <g stroke="#5b7cfa" stroke-width="2" stroke-linecap="round" opacity=".75">
    <line x1="48" y1="364" x2="96" y2="364"/><line x1="128" y1="364" x2="184" y2="364"/>
    <line x1="212" y1="364" x2="310" y2="364"/><line x1="348" y1="364" x2="404" y2="364"/>
    <line x1="428" y1="364" x2="508" y2="364"/><line x1="532" y1="364" x2="644" y2="364"/>
    <line x1="670" y1="364" x2="718" y2="364"/><line x1="742" y1="364" x2="800" y2="364"/>
    <line x1="818" y1="364" x2="852" y2="364"/>
  </g>
</svg>
