# dsh-aether-theme bundle patch：一个 Host 行。
#
# 行里的 config 全部有代码默认值（见 lib/config.js）。想改行为，优先在
# profile 自己的 cordis.patch.yml 里按 id 覆盖（同 id 覆盖会整体替换 config，
# 要保留的字段必须全部重写）。
#
#   - id: aether-theme
#     config:
#       logDir: D:/DSH-plugins/log/dsh-aether-theme   # 日志目录（记忆六件套：每插件一个文件夹）
#       dataDir: ''                                    # 配置/壁纸库根（默认 ~/.dsh/aether-theme）
#       maxWallpaperMB: 512                            # 单个壁纸文件上限（流式落盘，不占内存）
#       canary: true                                   # 宿主 DOM 契约金丝雀
#       routePrefix: /dsh-aether                       # HTTP API 前缀
- insert:
    - id: aether-theme
      name: dsh-aether-theme

# ── 组合包：费用统计伙伴 ──────────────────────────────────────────────
# 以太主题不再自带简陋的余额挂件，费用条交给 dsh-cost-meter（MIT，
# https://github.com/Han-1413141/dsh-cost-meter）：按会话统计 token/成本、
# 余额与峰谷价提醒、多厂商价格目录。
#
# 如果你的 profile 已经单独安装过 dsh-cost-meter，请删掉下面这一段，
# 否则同一插件会被注册两次。
- insert:
    - id: cost-meter
      name: dsh-cost-meter

# ── 组合包：片头动画 ──────────────────────────────────────────────────
# 以太主题不再自带开屏动画，片头交给 dsh-boot-splash-pro（BSD-3-Clause，
# 本地包：D:/DSH-plugins/dsh-boot-splash-pro）：首帧注入、官方加载卡片不再露脸。
#
# 如果你的 profile 已经单独安装过 dsh-boot-splash-pro，请删掉这一段，
# 否则同一插件会被注册两次。
- insert:
    - id: dsh-boot-splash-pro
      name: dsh-boot-splash-pro
